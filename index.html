<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"

    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />

    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="img/icon-192x192.png"
    />

      rel="icon"
      type="image/png"
      sizes="512x512"

  <body>
    <header>
      <!-- place navbar here -->
      <div class="container p-3 mt-xxl-5 mt-xl-5 mt-md-4 mt-sm-3">
        <div class="text-center">
          <div class="my-2">
            <img
              src="img/default pic.jpg"
              class="rounded-circle"

            <h5 class="mt-0">Escira Severnaya</h5>
            <p>Amateur Musician</p>

        </div>
      </div>
    </header>
    <main>
      <div class="container-fluid my-xxl-5 my-xl-5 my-md-5 my-sm-3 px-5">
        <div class="card text-white bg-light text-center my-2">
          <div class="card-body">
            <p class="card-text">
              <a
                href="https://instagram.com/essevernaya"
                class="link-dark"
                target="_blank"
                >Instagram</a
              >
            </p>
          </div>
        </div>
        <div class="card text-white bg-light text-center my-2">
          <div class="card-body">
            <p class="card-text">
              <a
                href="https://www.youtube.com/@escirasevernaya"
                class="link-dark"
                target="_blank"
                >YouTube</a
              >
            </p>
          </div>
        </div>
        <div class="card text-white bg-light text-center my-2">
          <div class="card-body">
            <p class="card-text">
              <a
                href="https://soundcloud.com/essevernaya"
                class="link-dark"
                target="_blank"
                >Soundcloud</a
              >
            </p>
          </div>
        </div>
        <div class="card text-white bg-light text-center my-2">
          <div class="card-body">
            <p class="card-text">
              <a
                href="mailto:escirasevernaya@gmail.com"
                class="link-dark"
                target="_blank"
                >Email</a
              >
            </p>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <!-- place footer here -->
      <div class="container mt-5">
        <p class="text-center text-muted">
          &copy;2026 Escira Severnaya <br />All rights reserved.
        </p>

    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
